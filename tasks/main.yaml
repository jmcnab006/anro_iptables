---
- name: ASSERT | Validate role inputs
  ansible.builtin.import_tasks: assert.yaml
  tags: [always]

- name: FACTS | Gather service facts
  ansible.builtin.service_facts:

- name: FACTS | Record Docker state
  ansible.builtin.set_fact:
    _anro_iptables_docker_installed: "{{ 'docker.service' in ansible_facts.services }}"
    _anro_iptables_docker_running: >-
      {{
        'docker.service' in ansible_facts.services
        and ansible_facts.services['docker.service'].state == 'running'
      }}

- name: PREPARE | Assemble effective rules
  ansible.builtin.import_tasks: prepare.yaml

- name: ASSERT | Validate assembled rules
  ansible.builtin.import_tasks: assert_prepared.yaml
  tags: [always]

- name: DEBUG | Show effective configuration
  ansible.builtin.import_tasks: debug.yaml
  when: anro_iptables_debug | bool

- name: INSTALL | Install firewall packages
  ansible.builtin.import_tasks: install.yaml

- name: IPSET | Configure IP sets
  ansible.builtin.import_tasks: ipset.yaml
  when: anro_iptables_ipset_enabled | bool

- name: IPSET | Apply IP sets before firewall rules
  ansible.builtin.meta: flush_handlers
  when: anro_iptables_ipset_enabled | bool

- name: CONFIGURE | Render firewall rules
  ansible.builtin.import_tasks: configure.yaml

- name: GATEWAY | Configure forwarding
  ansible.builtin.import_tasks: gateway.yaml

- name: SERVICE | Configure persistence service
  ansible.builtin.import_tasks: service.yaml
