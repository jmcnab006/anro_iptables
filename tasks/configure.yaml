---
- name: CONFIGURE | Ensure configuration directory exists
  ansible.builtin.file:
    path: "{{ anro_iptables_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: CONFIGURE | Render IPv4 rules
  ansible.builtin.template:
    src: etc/iptables/rules.v4.j2
    dest: "{{ anro_iptables_config_dir }}/{{ anro_iptables_ipv4_save_file }}"
    owner: root
    group: root
    mode: '0600'
    backup: true
    validate: "{{ anro_iptables_ipv4_command }} --test %s"
  when: anro_iptables_ipv4_enabled | bool
  notify:
    - Reload ipv4
    - Restart Docker after firewall change

- name: CONFIGURE | Remove persistent IPv4 rules when disabled
  ansible.builtin.file:
    path: "{{ anro_iptables_config_dir }}/{{ anro_iptables_ipv4_save_file }}"
    state: absent
  when: not (anro_iptables_ipv4_enabled | bool)

- name: CONFIGURE | Render IPv6 rules
  ansible.builtin.template:
    src: etc/iptables/rules.v6.j2
    dest: "{{ anro_iptables_config_dir }}/{{ anro_iptables_ipv6_save_file }}"
    owner: root
    group: root
    mode: '0600'
    backup: true
    validate: "{{ anro_iptables_ipv6_command }} --test %s"
  when: anro_iptables_ipv6_enabled | bool
  notify:
    - Reload ipv6
    - Restart Docker after firewall change

- name: CONFIGURE | Remove persistent IPv6 rules when disabled
  ansible.builtin.file:
    path: "{{ anro_iptables_config_dir }}/{{ anro_iptables_ipv6_save_file }}"
    state: absent
  when: not (anro_iptables_ipv6_enabled | bool)
