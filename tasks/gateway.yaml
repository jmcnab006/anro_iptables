---
- name: GATEWAY | Configure kernel forwarding persistence
  ansible.builtin.copy:
    dest: "{{ anro_iptables_sysctl_file }}"
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Ansible role anro_iptables
      net.ipv4.ip_forward={{ 1 if anro_iptables_gateway_enable | bool else 0 }}
      net.ipv6.conf.all.forwarding={{ 1 if anro_iptables_gateway_enable | bool else 0 }}
  register: _anro_iptables_forwarding_config

- name: GATEWAY | Apply kernel forwarding settings
  ansible.builtin.command:
    cmd: "sysctl -p {{ anro_iptables_sysctl_file }}"
  when: _anro_iptables_forwarding_config.changed
  changed_when: true
