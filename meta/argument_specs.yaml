          - Default IP set type.
      anro_iptables_ipset_save_file:
        type: str
        default: ipsets
        description:
          - Persistent IP set filename inside anro_iptables_config_dir.
      anro_iptables_ipsets:
        type: list
        elements: dict
        default: []
        options:
          name:
            type: str
            required: true
            description:
              - IP set name.
          type:
            type: str
            description:
              - IP set type; defaults to anro_iptables_ipset_type.
          family:
            type: str
            description:
              - 'Address family: inet or inet6.'
          hashsize:
            type: int
            description:
              - Hash size for this set.
          maxelem:
            type: int
            description:
              - Maximum elements for this set.
          bucketsize:
            type: int
            description:
              - Optional bucketsize supported by newer ipset versions.
          set:
            type: list
            elements: str
            required: true
            description:
              - Set members.
        description:
          - IP set definitions.
      anro_iptables_docker_enabled:
        type: bool
        default: false
        description:
          - Manage a restrictive DOCKER-USER filter chain when Docker is installed.
      anro_iptables_docker_restart_on_change:
        type: bool
        default: true
        description:
          - Restart a running Docker daemon after authoritative firewall changes so Docker recreates its chains.
      anro_iptables_docker_ipv4_subnets:
        type: list
        elements: str
        default:
          - 172.17.0.0/16
        description:
          - IPv4 Docker subnets returned from DOCKER-USER before custom restrictions.
      anro_iptables_docker_ipv6_subnets:
        type: list
        elements: str
        default:
          - fd00::/80
        description:
          - IPv6 Docker subnets returned from DOCKER-USER before custom restrictions.
      anro_iptables_ipv4_docker_rules:
        type: list
        elements: str
        default: []
        description:
          - Custom IPv4 DOCKER-USER rules inserted before the final DROP.
      anro_iptables_ipv6_docker_rules:
        type: list
        elements: str
        default: []
        description:
          - Custom IPv6 DOCKER-USER rules inserted before the final DROP.
      anro_iptables_gateway_enable:
        type: bool
        default: false
        description:
          - Enable IPv4 and IPv6 kernel packet forwarding.
      anro_iptables_sysctl_file:
        type: str
        default: /etc/sysctl.d/99-anro-iptables-forwarding.conf
        description:
          - Managed sysctl file for forwarding settings.
