---
argument_specs:
  main:
    short_description: Manage persistent Debian/Ubuntu iptables rulesets and optional IP sets.
    description:
      - Build complete IPv4 and IPv6 iptables-restore files with layered filter, nat, mangle, and raw tables.
    author: Jeremy McNab
    options:
      anro_iptables_debug:
        type: bool
        default: false
        description:
          - Enable additional debug output.
      anro_iptables_ipv4_enabled:
        type: bool
        default: true
        description:
          - Manage and persist IPv4 rules.
      anro_iptables_ipv6_enabled:
        type: bool
        default: true
        description:
          - Manage and persist IPv6 rules.
      anro_iptables_config_dir:
        type: str
        default: /etc/iptables
        description:
          - Directory containing persistent firewall files.
      anro_iptables_ipv4_save_file:
        type: str
        default: rules.v4
        description:
          - IPv4 persistent rules filename.
      anro_iptables_ipv6_save_file:
        type: str
        default: rules.v6
        description:
          - IPv6 persistent rules filename.
      anro_iptables_ipv4_command:
        type: str
        default: /usr/sbin/iptables-restore
        description:
          - Path to iptables-restore.
      anro_iptables_ipv6_command:
        type: str
        default: /usr/sbin/ip6tables-restore
        description:
          - Path to ip6tables-restore.
      anro_iptables_restore_noflush:
        type: bool
        default: false
        description:
          - Pass --noflush when applying rules. False makes rendered tables authoritative.
      anro_iptables_remove_firewalld:
        type: bool
        default: true
        description:
          - Remove firewalld to avoid competing firewall managers.
      anro_iptables_input_policy:
        type: str
        default: ACCEPT
        description:
          - Default INPUT policy for the filter table. ACCEPT, DROP, or QUEUE.
      anro_iptables_forward_policy:
        type: str
        default: ACCEPT
        description:
          - Default FORWARD policy for the filter table. ACCEPT, DROP, or QUEUE.
      anro_iptables_output_policy:
        type: str
        default: ACCEPT
        description:
          - Default OUTPUT policy for the filter table. ACCEPT, DROP, or QUEUE.
      anro_iptables_ipv4_filter_rules:
        type: list
        elements: str
        default: []
        description:
          - Direct IPV4 filter table rules.
      anro_iptables_ipv4_filter_rules0:
        type: list
        elements: str
        default: []
        description:
          - Layer 0 IPV4 filter rules. Layers are concatenated in numeric order.
