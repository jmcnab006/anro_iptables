  ---
- name: Create container instances
  hosts: localhost
  gather_facts: false
  tasks:

    - name: CREATE | Create a network with IPv6 and custom IPv4 IPAM config
      community.docker.docker_network:
        name: molecule-anro-iptables
        enable_ipv6: true
        ipam_config:
          - subnet: 172.30.0.0/24
          - subnet: fdd1:ac8c:0557:7ce2::/64

    - name: CREATE | Create containers
      community.docker.docker_container:
        name: "{{ item }}"
        hostname: "{{ item }}"
        image: "{{ hostvars[item]['container_image'] }}"
        command: "{{ hostvars[item]['container_command'] | default('sleep 1d') }}"
        privileged: "{{ hostvars[item]['container_privileged'] | default(false) }}"
        log_driver: "{{ hostvars[item]['container_log_driver'] | default('json-file') }}"
        volumes: "{{ hostvars[item]['container_volumes'] | default(omit) }}"
        tmpfs: "{{ hostvars[item]['container_tmpfs'] | default(omit) }}"
        cgroupns_mode: host
        state: started
        exposed_ports: "{{ hostvars[item]['container_exposed_ports'] | default(omit) }}"
        published_ports: "{{ hostvars[item]['container_published_ports'] | default(omit) }}"
        networks:
          - name: molecule-anro-iptables
            ipv4_address: "{{ hostvars[item]['container_ipv4_address'] }}"
      register: _create_results
      loop: "{{ groups['server'] }}"
      loop_control:
        label: "{{ item }}"
