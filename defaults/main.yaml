---

# General
anro_iptables_debug: false
anro_iptables_ipv4_enabled: true
anro_iptables_ipv6_enabled: true
anro_iptables_config_dir: '/etc/iptables'
anro_iptables_ipv4_save_file: 'rules.v4'
anro_iptables_ipv6_save_file: 'rules.v6'
anro_iptables_ipv4_command: '/usr/sbin/iptables-restore'
anro_iptables_ipv6_command: '/usr/sbin/ip6tables-restore'
anro_iptables_restore_noflush: false
anro_iptables_remove_firewalld: true

# Filter table policies
anro_iptables_input_policy: 'ACCEPT'
anro_iptables_forward_policy: 'ACCEPT'
anro_iptables_output_policy: 'ACCEPT'

