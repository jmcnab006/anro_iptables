---
anro_iptables_debug: false

anro_iptables_ipv4_command: '/usr/sbin/iptables-restore'
anro_iptables_ipv6_command: '/usr/sbin/ip6tables-restore'
anro_iptables_ipset_command: '/usr/sbin/ipset'

anro_iptables_docker_enabled: false
anro_iptables_docker_ipv4_subnets:
  - '172.17.0.0/16'
anro_iptables_docker_ipv6_subnets:
  - 'fd00::/80'

anro_iptables_input_policy: accept
anro_iptables_forward_policy: accept
anro_iptables_output_policy: accept

# IPv4/IPv6 rule sets that will be concatenated in ascending order. Allows similar blocks of rules across
# environments without duplicating rulesets.
anro_iptables_ipv4_rules0: []
anro_iptables_ipv4_rules1: []
anro_iptables_ipv4_rules2: []
anro_iptables_ipv4_rules3: []
anro_iptables_ipv4_rules4: []
anro_iptables_ipv4_rules5: []
anro_iptables_ipv4_rules6: []
anro_iptables_ipv4_rules7: []
anro_iptables_ipv4_rules8: []
anro_iptables_ipv4_rules9: []

anro_iptables_ipv6_rules0: []
anro_iptables_ipv6_rules1: []
anro_iptables_ipv6_rules2: []
anro_iptables_ipv6_rules3: []
anro_iptables_ipv6_rules4: []
anro_iptables_ipv6_rules5: []
anro_iptables_ipv6_rules6: []
anro_iptables_ipv6_rules7: []
anro_iptables_ipv6_rules8: []
anro_iptables_ipv6_rules9: []


# These will be the DOCKER-USER rules
anro_iptables_ipv4_docker_rules: []

# Docker does not have very good ipv6 support but we should add this now
anro_iptables_ipv6_docker_rules: []

# The joined rules should form a full iptables rules set.

anro_iptables_ipv4_rules: >-
  {{ anro_iptables_ipv4_rules0
   + anro_iptables_ipv4_rules1
   + anro_iptables_ipv4_rules2
   + anro_iptables_ipv4_rules3
   + anro_iptables_ipv4_rules4
   + anro_iptables_ipv4_rules5
   + anro_iptables_ipv4_rules6
   + anro_iptables_ipv4_rules7
   + anro_iptables_ipv4_rules8
   + anro_iptables_ipv4_rules9 }}

anro_iptables_ipv6_rules: >-
  {{ anro_iptables_ipv6_rules0
   + anro_iptables_ipv6_rules1
   + anro_iptables_ipv6_rules2
   + anro_iptables_ipv6_rules3
   + anro_iptables_ipv6_rules4
   + anro_iptables_ipv6_rules5
   + anro_iptables_ipv6_rules6
   + anro_iptables_ipv6_rules7
   + anro_iptables_ipv6_rules8
   + anro_iptables_ipv6_rules9 }}

anro_iptables_host_groups: []

anro_iptables_ansible_host_groups: []
anro_iptables_ansible_host_groups_ipv4_hostvar: 'ipv4'
anro_iptables_ansible_host_groups_ipv6_hostvar: 'ipv6'

anro_iptables_ipset_enabled: false
anro_iptables_ipset_hashsize: 1024
anro_iptables_ipset_maxelem: 65536
anro_iptables_ipset_family: 'inet'
anro_iptables_ipset_type: 'hash:net'
anro_iptables_ipset_config_dir: '/etc/iptables'
anro_iptables_ipset_save_file: 'ipsets'

anro_iptables_ipsets: []
anro_iptables_nics: []
anro_iptables_interfaces: []
# replaces the anro_gateway role which enables sysctl packet forwarding.
anro_iptables_gateway_enable: false
