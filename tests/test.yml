---
- name: Smoke-test anro_iptables
  hosts: localhost
  connection: local
  become: true
  roles:
    - role: anro_iptables
      anro_iptables_input_policy: ACCEPT
      anro_iptables_forward_policy: ACCEPT
      anro_iptables_output_policy: ACCEPT
      anro_iptables_ipv4_filter_rules1:
        - '-A INPUT -i lo -j ACCEPT'
      anro_iptables_ipv4_nat_rules1:
        - '-A POSTROUTING -s 192.0.2.0/24 -j MASQUERADE'
      anro_iptables_ipv4_mangle_rules1:
        - '-A OUTPUT -p tcp --dport 443 -j MARK --set-mark 1'
      anro_iptables_ipv4_raw_rules1:
        - '-A OUTPUT -p udp --dport 8125 -j NOTRACK'
